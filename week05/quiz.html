<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Basic Quiz form</title>
    <link rel="stylesheet" href="styles/quiz.css">

</head>

<body>
    <main class="box">
        <h1> ✅ Basic html and css quiz </h1>
        <form class="=box">
            <div class="Quiz-item">
                <label for="q1">1. what does css strand for?</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div class="Quiz-item">
                <label for="q2">2. How are id and class attribute selected in css</label>
                <textarea id="q2" name="q2"></textarea>
            </div>

            <div class="Quiz-item">
                <label for="q3">3. which of the following is a valid css</label>
                <select id="q3" name="q3">
                    <option value=" " selected disable></option>
                    <option value="a">&lt;--this is a comment--&lt;</option>
                    <option value="b"> /*this is a comment*/</option>
                    <option value="c">//this is a comment//</option>
                </select>
            </div>

            <div class="Quiz-item box">
                <label for="q4">4. what is the bottom margin giving this declaration? </label>
                <code class="box"> margin: 10px 5px  15px;</code>
                <input type="number" id="q4" name="q4">
            </div>
            <button type="submit">Submit Quiz</button>

        </form>


    </main>


</body>

</html>
